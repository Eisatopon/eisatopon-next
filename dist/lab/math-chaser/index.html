        @keyframes slideIn { 0%{transform:translateX(-8px);opacity:.5} 100%{transform:translateX(0);opacity:1} }

        .mc-text-btn {

          font-size:14px; cursor:pointer; margin-top:12px; display:block; margin-left:auto; margin-right:auto;

        }
