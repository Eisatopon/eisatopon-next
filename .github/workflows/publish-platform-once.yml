name: Publish corrected platform build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-platform-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: Eisatopon/Platforma-Mathimatikon
          ref: main
          path: platform-source
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build platform
        working-directory: platform-source/frontend
        env:
          PUBLIC_URL: /platforma
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps ajv@8.17.1 ajv-keywords@5.1.0
          npm run build
      - name: Replace published platform
        run: |
          mkdir -p public/platforma/admin
          rsync -a --delete --exclude='admin/' platform-source/frontend/build/ public/platforma/
          cp public/platforma/index.html public/platforma/admin/index.html
      - name: Publish and remove workflow
        run: |
          rm .github/workflows/publish-platform-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/platforma .github/workflows/publish-platform-once.yml
          git commit -m "Restore Platforma books and chapters"
          git push
