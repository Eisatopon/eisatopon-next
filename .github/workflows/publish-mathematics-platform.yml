name: Publish mathematics platform

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-mathematics-platform.yml"

permissions:
  contents: write

concurrency:
  group: publish-mathematics-platform
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out live site
        uses: actions/checkout@v4

      - name: Check out platform source
        uses: actions/checkout@v4
        with:
          repository: Eisatopon/Platforma-Mathimatikon
          path: platform-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: platform-source/frontend
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build platform
        working-directory: platform-source/frontend
        env:
          CI: "false"
          PUBLIC_URL: /platforma
          REACT_APP_BACKEND_URL: https://platforma-mathimatikon.onrender.com
        run: npm run build

      - name: Replace published platform files
        shell: bash
        run: |
          mkdir -p public/platforma
          rsync -a --delete platform-source/frontend/build/ public/platforma/
          printf '%s\n' "$(git -C platform-source rev-parse HEAD)" > public/platforma/.source-commit

      - name: Create SPA fallback pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sys

          sys.path.insert(0, "platform-source/backend")
          from seed_content import all_docs

          target = Path("public/platforma")
          index = target / "index.html"
          grades, lessons = all_docs()
          routes = ["achievements", "admin"]
          routes.extend(f"grade/{grade['id']}" for grade in grades)
          routes.extend(f"lesson/{lesson['id']}" for lesson in lessons)

          for route in routes:
              destination = target / route
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copy2(index, destination / "index.html")

          print(f"Created {len(routes)} direct-link fallback pages.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/platforma
          if git diff --cached --quiet; then
            echo "The live platform is already up to date."
            exit 0
          fi
          source_sha="$(git -C platform-source rev-parse --short HEAD)"
          git commit -m "Publish mathematics platform $source_sha"
          git push


