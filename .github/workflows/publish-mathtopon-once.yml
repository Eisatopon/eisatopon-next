name: Publish MathTopon once

on:
  push:
    paths:
      - ".github/workflows/publish-mathtopon-once.yml"

permissions:
  contents: write

concurrency:
  group: publish-mathematics-platform
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live site
        uses: actions/checkout@v4

      - name: Check out platform source
        uses: actions/checkout@v4
        with:
          repository: Eisatopon/Platforma-Mathimatikon
          path: platform-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform-source/frontend/package-lock.json

      - name: Install dependencies
        working-directory: platform-source/frontend
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build MathTopon
        working-directory: platform-source/frontend
        env:
          CI: "false"
          PUBLIC_URL: /platforma
          REACT_APP_BACKEND_URL: https://platforma-mathimatikon.onrender.com
        run: npm run build

      - name: Replace published platform
        shell: bash
        run: |
          mkdir -p public/platforma
          rsync -a --delete platform-source/frontend/build/ public/platforma/
          printf '%s\n' "$(git -C platform-source rev-parse HEAD)" > public/platforma/.source-commit

      - name: Publish and remove one-time trigger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/platforma
          git rm .github/workflows/publish-mathtopon-once.yml
          source_sha="$(git -C platform-source rev-parse --short HEAD)"
          git commit -m "Publish MathTopon $source_sha"
          git push
